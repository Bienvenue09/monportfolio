<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="stylesheet" href="Léone.css">
</head>
<body>
    <header>
        <h2 class="Logo">Formulaire</h2>
        <nav class="navigation">
            <a href="#">Acceuil</a>
            <a href="#">Services</a>
            <a href="#">Conctat</a>
            <a href="#">A propos</a>
            <button class="btnlogin">Se connecter</button>
        </nav>
    </header>
    <div class="wrapper">
            <div class="form">
                <h2>Formulaire</h2>
                <form action="#">
                    <div class="input">
                        <input type="email" required>
                        <label>Email</label>
                    </div>
                    <div class="input">
                        <input type="password" required>
                        <label>Password</label>
                    </div>
                    <div class="remember">
                        <label><input type="checkbox">Remember me</label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn">Enregistrer</button>
                    <div class="Eregister">
                        <p>Don't have an account <a href="#" class="Eregister-link"> Register</a></p>
                    </div>
                </form>
            </div>
    </div>




    <script src="Léonel.js"></script>
</body>
</html>
